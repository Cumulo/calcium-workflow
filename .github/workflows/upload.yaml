name: Try to upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1
        with:
          tools: calcit,caps

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Validate Calcit snapshot, types and tests
        run: |
          caps --strict --ci
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze dynamic-methods --summary-only --format json \
            | jq -e '.data.summary.findings <= 1' > /dev/null
          calcit calcit.cirru --entry server --check-only
          calcit calcit.cirru --entry server analyze dynamic-methods --summary-only --format json \
            | jq -e '.data.summary.findings <= 1' > /dev/null
          calcit calcit.cirru analyze deprecated --summary-only --format json \
            | jq -e '.data.summary.calls == 0' > /dev/null
          calcit calcit.cirru --entry server analyze deprecated --summary-only --format json \
            | jq -e '.data.summary.calls == 0' > /dev/null
          calcit calcit.cirru test --tag client --require-match --summary-only --format json
          calcit calcit.cirru --entry server test --tag server --require-match --summary-only --format json
          yarn check-types

      - run: yarn compile-page && yarn release-page

      - name: Verify Session and User Option projections in generated JS
        run: yarn node tests/session-option.mjs

      - name: Verify client publication, dispatch and browser boundaries
        run: |
          for test_file in client-patch respo-client-boundaries mount-boundary stored-login connection-url; do
            yarn node --import ./tests/register-node-resolution.mjs "tests/$test_file.mjs"
          done

      - name: Verify deterministic diff and patch workload
        run: yarn node tests/diff-patch-workload.mjs --mode smoke

      - name: Verify Kanban partitions and cold queries against the native server
        run: |
          port=5099 calcit calcit.cirru --entry server > kanban-server.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 60); do
            grep -q "WebSocket server started" kanban-server.log && break
            sleep 0.5
          done
          status=0
          yarn node tests/kanban-e2e.mjs ws://127.0.0.1:5099 || status=$?
          kill "$server_pid" || true
          if [ "$status" -ne 0 ]; then cat kanban-server.log; fi
          exit "$status"

      - run: mkdir -p dist-server && cp calcit.cirru dist-server && cp package.json dist-server/
        name: Copy server scripts

      - name: Upload web assets
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"

      - name: Upload server script
        id: deploy-server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist-server/*"
          dest: "rsync-user@tiye.me:/servers/calcium-workflow/"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy-server.outputs.status }}"
