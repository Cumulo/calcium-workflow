name: Try to upload

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - uses: calcit-lang/setup-calcit@v1
        with:
          tools: calcit,caps

      - name: Validate Calcit snapshot and type baseline
        run: |
          caps --strict --ci
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru --entry server --check-only
          calcit calcit.cirru --entry server test --tag server --require-match --summary-only --format json
          mkdir -p .calcit/upgrade
          calcit calcit.cirru analyze check-types --summary-only --format json > .calcit/upgrade/check-types.json
          calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic,code-nil --intent unresolved,declared-optional --summary-only --format json > .calcit/upgrade/weak-types.json
          calcit calcit.cirru analyze deprecated --summary-only --format json > .calcit/upgrade/deprecated.json
          node scripts/check-calcit-upgrade-baseline.mjs

      - run: yarn install --immutable && yarn compile-page && yarn release-page

      - run: mkdir -p dist-server && cp calcit.cirru dist-server && cp package.json dist-server/
        name: Copy server scripts

      - name: Upload web assets
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"

      - name: Upload server script
        id: deploy-server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist-server/*"
          dest: "rsync-user@tiye.me:/servers/calcium-workflow/"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy-server.outputs.status }}"
