name: Try to upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1
        with:
          tools: calcit,caps

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Validate Calcit snapshot and quality gates
        run: |
          caps --strict --ci
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze dynamic-methods --max 1
          calcit calcit.cirru --entry server --check-only
          calcit calcit.cirru --entry server analyze dynamic-methods --max 1
          calcit calcit.cirru analyze deprecated --summary-only --format json \
            | jq -e '.data.summary.calls == 0' > /dev/null
          calcit calcit.cirru --entry server analyze deprecated --summary-only --format json \
            | jq -e '.data.summary.calls == 0' > /dev/null
          calcit calcit.cirru test --tag client --require-match --summary-only --format json
          calcit calcit.cirru --entry server test --tag server --require-match --summary-only --format json
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

      - run: yarn compile-page && yarn release-page

      - run: mkdir -p dist-server && cp calcit.cirru dist-server && cp package.json dist-server/
        name: Copy server scripts

      - name: Upload web assets
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"

      - name: Upload server script
        id: deploy-server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist-server/*"
          dest: "rsync-user@tiye.me:/servers/calcium-workflow/"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy-server.outputs.status }}"
