name: Try to upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: upload-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: 0.1.1

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Validate Calcit snapshot, types and tests
        run: |
          set -euo pipefail
          caps --strict --ci
          caps verify --toolchain
          test -f calcit.cirru
          test -f deps.cirru
          test ! -e compact.cirru
          test ! -e package.cirru
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze weak-types --only dynamic-method --summary-only --format json \
            | jq -e '.data.summary.findings == 0' > /dev/null
          calcit calcit.cirru --entry server --check-only
          calcit calcit.cirru fix --workflow strict --verify --format json \
            | jq -e '.data.workflow.status == "passed" and .diagnostics == [] and all(.data.workflow.review_required.type_findings[]; .kind != "unsafe-coerce")'
          calcit calcit.cirru --entry server analyze weak-types --only dynamic-method --summary-only --format json \
            | jq -e '.data.summary.findings == 0' > /dev/null
          calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only --format json \
            | jq -e '.data.summary.calls == 0' > /dev/null
          calcit calcit.cirru --entry server analyze weak-types --only deprecated-call --summary-only --format json \
            | jq -e '.data.summary.calls == 0' > /dev/null
          calcit calcit.cirru test --tag client --require-match --summary-only --format json
          calcit calcit.cirru --entry server test --require-match --summary-only --format json
          yarn check-types
          yarn node tests/template-boundary.mjs --list

      - name: Select CDN asset path
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/"
          fi
          base_url="${CDN_ORIGIN}/${asset_prefix}"
          echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"

      - run: yarn compile-page && yarn release-page

      - name: Verify Session and User Option projections in generated JS
        run: yarn node tests/session-option.mjs

      - name: Verify client publication, dispatch and browser boundaries
        run: |
          for test_file in client-patch respo-client-boundaries mount-boundary stored-login connection-url; do
            yarn node --import ./tests/register-node-resolution.mjs "tests/$test_file.mjs"
          done

      - name: Verify deterministic diff and patch workload
        run: yarn node tests/diff-patch-workload.mjs --mode smoke

      - name: Verify Kanban partitions and cold queries against the native server
        run: |
          port=5099 calcit calcit.cirru --entry server > kanban-server.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 60); do
            grep -q "WebSocket server started" kanban-server.log && break
            sleep 0.5
          done
          status=0
          yarn node tests/kanban-e2e.mjs ws://127.0.0.1:5099 || status=$?
          kill "$server_pid" || true
          if [ "$status" -ne 0 ]; then cat kanban-server.log; fi
          exit "$status"

      - run: mkdir -p dist-server && cp calcit.cirru deps.cirru package.json dist-server/
        name: Copy server scripts

      - name: Check COS credentials
        id: cos-credentials
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "::warning title=COS upload skipped::Configure COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY to run public upload verification."
            else
              echo "::error title=COS credentials missing::COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY are required for production deployment."
              exit 1
            fi
          fi

      - name: Upload and verify frontend assets on COS
        if: steps.cos-credentials.outputs.available == 'true'
        uses: worktools/cos-upload-action@v1.2.0
        timeout-minutes: 10
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Upload web assets
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"

      - name: Upload server script
        id: deploy-server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist-server/*"
          dest: "rsync-user@tiye.me:/servers/calcium-workflow/"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy-server.outputs.status }}"
